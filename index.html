<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTEmio - Galeria Digital</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Montserrat para um visual premium -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <header>
        <div class="logo-container">
            <h1>ARTE<span>mio</span></h1>
            <p>Galeria de Inventário Digital</p>
        </div>
        
        <!-- Botão Admin e Filtros -->
        <div class="filters">
            <button class="filter-btn active" data-category="all">Todas as Obras</button>
            <button class="filter-btn" data-category="A">Pinturas A</button>
            <button class="filter-btn" data-category="B">Pinturas B</button>
            <button class="filter-btn" data-category="C">Pinturas C</button>
        </div>

    </header>

    <main id="gallery-grid" class="gallery-grid">
        <!-- Os cards dos quadros serão inseridos via Javascript -->
        <div class="loader">Carregando Galeria...</div>
    </main>

    <!-- Modal de Detalhes -->
    <div id="detail-modal" class="modal">
        <div class="modal-content glass">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modal-image" src="" alt="Imagem do Quadro">
                </div>
                <div class="modal-info">
                    <h2 id="modal-title">ID: ---</h2>
                    <hr>
                    <div class="info-row">
                        <span class="label">Tamanho:</span>
                        <span id="modal-size">---</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Material:</span>
                        <span id="modal-material">---</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Preço:</span>
                        <span id="modal-price" class="price-tag">---</span>
                    </div>
                    <div class="modal-actions">
                        <a id="modal-link" href="#" target="_blank" class="view-original-btn">ver detalhes e vídeo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Artemio's Paintings - Catálogo de Inventário</p>
    </footer>

    <script src="theme.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
